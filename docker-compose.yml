# Test database only (yarn test:db). Dev and production use Neon.
# Data lives in tmpfs: it's fast and disappears with the container, which is what tests want.
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_test
    ports:
      - '5433:5432' # 5433 so it never collides with a local Postgres on 5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio_test']
      interval: 2s
      timeout: 3s
      retries: 15
